[build-system]
requires = [
    "hatchling>=1.27.0",
]
build-backend = "hatchling.build"

[project]
name = "checkdmarc"
dynamic = [
    "version",
]
requires-python = ">=3.10"
description = "A Python module and command line parser for SPF and DMARC records"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Sean Whalen", email = "whalenster@gmail.com" },
]
keywords = [
    "DMARC",
    "DNS",
    "SPF",
    "BIMI",
    "MTA-STS"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Security",
    "Topic :: Communications :: Email",
]
dependencies = [
    # The [doh] extra supplies the httpx/h2 floors DNS over HTTPS needs;
    # 2.7.0 is the floor verified against the dns.nameserver and
    # dns.query.https(session=...) APIs utils.py builds on.
    "dnspython[doh]>=2.7.0",
    # Imported directly for the shared DNS over HTTPS client in utils.py;
    # 0.26.0 matches the floor the dnspython [doh] extra sets.
    "httpx>=0.26.0",
    "cryptography>=50.0.0",
    "pem>=23.1.0",
    "expiringdict>=1.1.4",
    "publicsuffixlist>=0.10.0",
    "pyleri>=1.3.2",
    "requests>=2.25.0",
    "xmltodict>=0.14.2",
    "importlib-resources>=6.0",
]

[project.optional-dependencies]
build = [
    "hatch>=1.14.0",
    "myst-parser[linkify]",
    "nose",
    "pyright",
    "pytest",
    "pytest-cov",
    "ruff",
    "sphinx",
    "sphinx_rtd_theme",
]


[project.scripts]
checkdmarc = "checkdmarc._cli:_main"

[project.urls]
Homepage = "https://github.com/domainaware/checkdmarc"
Documentation = "https://domainaware.github.io/checkdmarc/"
Issues = "https://github.com/domainaware/checkdmarc/issues"
Changelog = "https://github.com/domainaware/checkdmarc/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "checkdmarc/_constants.py"

[tool.hatch.build.targets.sdist]
include = [
    "/checkdmarc",
]

[tool.hatch.build.targets.wheel]
packages = ["checkdmarc"]

[tool.coverage.run]
# Coverage measures shipped code only.
source = ["checkdmarc"]