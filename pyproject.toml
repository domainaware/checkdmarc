[build-system]
requires = [
    "hatchling>=1.27.0",
]
build-backend = "hatchling.build"

[project]
name = "checkdmarc"
dynamic = [
    "version",
]
requires-python = ">=3.10"
description = "A Python module and command line parser for SPF and DMARC records"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Sean Whalen", email = "whalenster@gmail.com" },
]
keywords = [
    "DMARC",
    "DNS",
    "SPF",
    "BIMI",
    "MTA-STS"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Security",
    "Topic :: Communications :: Email",
]
dependencies = [
    "dnspython>=2.0.0",
    "cryptography>=50.0.0",
    # checkdmarc no longer imports pyopenssl; certificate handling uses
    # cryptography.x509 directly. This floor is kept for one release so that
    # upgrading checkdmarc also upgrades any leftover pyOpenSSL to a version
    # compatible with cryptography 50 (older pyOpenSSL breaks at import
    # against it). Remove this dependency in the release after 5.17.5.
    "pyopenssl>=26.4.0",
    "pem>=23.1.0",
    "expiringdict>=1.1.4",
    "publicsuffixlist>=0.10.0",
    "pyleri>=1.3.2",
    "requests>=2.25.0",
    "xmltodict>=0.14.2",
    "importlib-resources>=6.0",
]

[project.optional-dependencies]
build = [
    "hatch>=1.14.0",
    "myst-parser[linkify]",
    "nose",
    "pyright",
    "pytest",
    "pytest-cov",
    "ruff",
    "sphinx",
    "sphinx_rtd_theme",
]


[project.scripts]
checkdmarc = "checkdmarc._cli:_main"

[project.urls]
Homepage = "https://github.com/domainaware/checkdmarc"
Documentation = "https://domainaware.github.io/checkdmarc/"
Issues = "https://github.com/domainaware/checkdmarc/issues"
Changelog = "https://github.com/domainaware/checkdmarc/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "checkdmarc/_constants.py"

[tool.hatch.build.targets.sdist]
include = [
    "/checkdmarc",
]

[tool.hatch.build.targets.wheel]
packages = ["checkdmarc"]

[tool.coverage.run]
# Coverage measures shipped code only.
source = ["checkdmarc"]